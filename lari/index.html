<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Controle de Gastos - Larissa</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212">
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192_.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="../icon-192_.png">

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
    }

    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #ffffff !important;
      }
    }

    /* Trava rígida contra o flash branco do motor WebKit (iOS) */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #121212 !important;
      opacity: 0;
      visibility: hidden;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
      transition: opacity 0.35s ease-in-out;
    }

    iframe.visivel {
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>
</head>
<body>
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwfeWicwMXqOshR4ZhuRQ_569kzNyjtx9UARJBJo8xibjI-Q6fNukDucOkGDRuQzCVF/exec?u=lari" 
    allowtransparency="true">
  </iframe>

  <script>
    function exibirIframeSuave() {
      const frame = document.getElementById("appFrame");
      if (frame && !frame.classList.contains("visivel")) {
        frame.classList.add("visivel");
      }
    }

    // Ouve a notificação enviada do interior do Google Apps Script
    window.addEventListener("message", function(e) {
      if (e.data === "appPronto") {
        exibirIframeSuave();
      }
    });

    // Fallback de segurança: se a rede atrasar, exibe após 3.5s
    setTimeout(exibirIframeSuave, 3500);
  </script>
</body>
</html>
